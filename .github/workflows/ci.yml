name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gettext libglib2.0-bin zip
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Build the extension zip
        run: make zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
