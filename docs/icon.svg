<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Dock Right-Click Menu</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3a8c"/>
      <stop offset="1" stop-color="#26324f"/>
    </linearGradient>
    <linearGradient id="menu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e6f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <!-- dock -->
  <rect x="30" y="34" width="52" height="188" rx="20" fill="#ffffff" fill-opacity=".16"/>
  <rect x="42" y="50" width="28" height="28" rx="8" fill="#ffffff" fill-opacity=".85"/>
  <rect x="42" y="90" width="28" height="28" rx="8" fill="#ffffff" fill-opacity=".55"/>
  <rect x="42" y="130" width="28" height="28" rx="8" fill="#ffffff" fill-opacity=".55"/>
  <!-- pointer position in the empty part of the dock -->
  <circle cx="56" cy="190" r="6" fill="#ffffff" fill-opacity=".9"/>
  <!-- menu -->
  <g filter="url(#shadow)">
    <rect x="96" y="76" width="132" height="124" rx="16" fill="url(#menu)"/>
  </g>
  <!-- entry 1 -->
  <rect x="112" y="92" width="20" height="20" rx="6" fill="#e95420"/>
  <rect x="142" y="97" width="72" height="10" rx="5" fill="#3b3550"/>
  <!-- separator -->
  <rect x="112" y="122" width="102" height="3" rx="1.5" fill="#3b3550" fill-opacity=".22"/>
  <!-- entry 2 -->
  <rect x="112" y="136" width="20" height="20" rx="6" fill="#5b3a8c"/>
  <rect x="142" y="141" width="58" height="10" rx="5" fill="#3b3550"/>
  <!-- entry 3 with submenu arrow -->
  <rect x="112" y="166" width="20" height="20" rx="6" fill="#2b8a6e"/>
  <rect x="142" y="171" width="44" height="10" rx="5" fill="#3b3550"/>
  <path d="M205 170l8 6-8 6z" fill="#3b3550"/>
</svg>
